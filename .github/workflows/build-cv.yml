name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv.*.md"
      - "Makefile"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-recommended texlive-latex-extra lmodern fonts-liberation

          # Ubuntu's apt pandoc is too old to ship the partial default-template
          # files (document-metadata.latex, fonts.latex, ...) that cv-template.tex
          # references via $name.latex()$ calls, so install a known-good release
          # directly instead of relying on the distro package.
          PANDOC_VERSION=3.11
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb

      - name: Build PDFs
        run: make MAINFONT="Liberation Sans"

      - name: Publish release with PDFs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV build
          body: Auto-built from the latest push to main. Not a versioned release.
          make_latest: true
          files: |
            cv.de.pdf
            cv.en.pdf
